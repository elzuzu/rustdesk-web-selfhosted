# Echecs d'authentification Basic sur le client web RustDesk.
#
# Lit le journal d'acces nginx au format « rdauth » :
#   203.0.113.10 - - [15/Sep/2026:14:10:11 +0000] "GET /x HTTP/1.1" 401
#
# Seuls les 401 comptent. Les 429 sont exclus a dessein : un visiteur legitime
# qui declenche la limitation de debit ne doit pas etre banni pour autant.
#
# Les %% du motif de date sont voulus : configparser interprete un % isole.
[Definition]
failregex = ^<HOST> -.*" 401\s*$
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
