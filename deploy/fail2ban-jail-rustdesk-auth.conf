# Bannit les forçages de l'authentification Basic du client web RustDesk.
#
# L'URL est publique depuis le 12 aout dans les journaux de transparence des
# certificats : n'importe qui peut la trouver et tenter des mots de passe. La
# limitation de debit nginx ralentit ; c'est ce bannissement qui arrete.
#
# « port » est volontairement limite au web. Sans cette ligne, fail2ban bannit
# l'adresse sur TOUS les ports et une erreur ici couperait aussi SSH.
[rustdesk-auth]
enabled  = true
filter   = rustdesk-auth
logpath  = /home/ubuntu/rustdesk-web/logs/access.log
port     = http,https
maxretry = 10
findtime = 600
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1
