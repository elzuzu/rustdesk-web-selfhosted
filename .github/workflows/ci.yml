name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Lint & Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requis par check-syntax.sh, qui refuse de passer sous silence
      # l'absence de node en integration continue.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Shell scripts syntax
        run: |
          for s in setup.sh scripts/*.sh; do bash -n "$s"; done

      # Le controle qui manquait : un bloc <script> qui ne se parse pas est
      # abandonne EN ENTIER par le navigateur, et tout l'etat de l'application
      # tient dans un seul bloc. Une page entierement inerte etait donc
      # publiable sans qu'aucune etape ne s'en apercoive.
      - name: Check inline JavaScript syntax
        run: ./scripts/check-syntax.sh

      - name: Test Asset Extraction & Patching
        run: |
          ./scripts/extract-assets.sh
          ./scripts/patch-assets.sh

      - name: Generate CI Configuration
        run: |
          printf 'admin:$6$rounds=5000$test$salt\n' > .htpasswd
          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_BACKEND_HOST__|127.0.0.1|g" \
              -e "s|__RD_PUBLIC_KEY__|ci_test_key|g" \
              -e "s|__RD_DEFAULT_PEER_ID__||g" \
              -e "s|__RD_ACME_EMAIL__|ci@example.com|g" \
              -e "s|__RD_SESSION_TOKEN__|ci_token|g" \
              nginx.conf.template > nginx.conf

          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_ACME_EMAIL__|ci@example.com|g" \
              Caddyfile.template > Caddyfile

          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_PUBLIC_KEY__|ci_test_key|g" \
              -e "s|__RD_DEFAULT_PEER_ID__||g" \
              web/index.html.template > html/index.html

      # La substitution elle-meme peut casser la page : une valeur contenant
      # un guillemet ou une barre oblique inverse suffit. On revalide donc la
      # page rendue, pas seulement le gabarit.
      - name: Check rendered page syntax
        run: ./scripts/check-syntax.sh html/index.html

      # Ce que patch-assets.sh corrige est vital : sans ses quatre correctifs,
      # aucune connexion n'aboutit. Une evolution du bundle les ferait echouer
      # en silence.
      - name: Verify bundle patches were applied
        run: |
          for m in '/ws/relay' 'get_conn_status'; do
            grep -q -- "$m" html/js/dist/index.js \
              || { echo "correctif absent du bundle : $m"; exit 1; }
          done

      - name: Build Docker Image
        run: |
          docker build -t rustdesk-web:ci .
          docker build -t rustdesk-tls:ci -f Dockerfile.tls .

      # Un conteneur qui demarre ne prouve rien ; on veut la configuration
      # nginx validee et le refus d'acces effectif.
      - name: Smoke test the web image
        run: |
          docker run --rm rustdesk-web:ci nginx -t
          docker run -d --name rdweb-ci -p 18081:80 rustdesk-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/healthz || true)
            [ "$code" = "204" ] && break
            sleep 1
          done
          test "$code" = "204" || { docker logs rdweb-ci; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/)
          test "$code" = "401" || { echo "page accessible sans identifiants : $code"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/js/dist/index.js.orig)
          test "$code" = "404" || { echo "sources non corrigees servies : $code"; exit 1; }

          docker rm -f rdweb-ci
