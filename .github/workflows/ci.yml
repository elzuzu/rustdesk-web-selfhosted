# Ces controles s'executent aussi en local, sans Actions :
#
#     ./scripts/verify.sh
#
# Meme chaine, meme ordre, sur une copie temporaire — ton arborescence n'est
# pas touchee. Utile quand Actions n'est pas disponible, et de toute facon
# preferable avant d'ouvrir une PR : la boucle est plus courte.
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-build:
    name: Lint & Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requis par check-syntax.sh, qui refuse de passer sous silence
      # l'absence de node en integration continue.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Shell scripts syntax
        run: |
          for s in setup.sh scripts/*.sh; do bash -n "$s"; done

      - name: Check Python tools syntax
        run: python3 -m py_compile scripts/relay-probe.py

      # « docker exec hbbs cat /root/id_ed25519.pub » a ete la seule instruction
      # que ce depot donnait pour relever la cle du serveur, et elle ne peut pas
      # fonctionner : l'image n'a pas de shell, et le fichier .pub n'est jamais
      # relu par hbbs donc il manque le plus souvent. Elle a envoye les
      # utilisateurs chercher leur cle ailleurs, ce qui EST la panne. On la
      # refuse la ou elle serait executee ; la citer en prose reste permis.
      - name: Refuse the impossible key-reading command
        run: |
          python3 - <<'GARDE'
          import pathlib, re, sys
          fautes = []
          for f in ("README.md", "README.fr.md"):
              texte = pathlib.Path(f).read_text(encoding="utf-8")
              for bloc in re.findall(r"```.*?```", texte, re.S):
                  if "id_ed25519.pub" in bloc:
                      fautes.append(f + " : id_ed25519.pub dans un bloc de code")
          gabarit = pathlib.Path("web/index.html.template").read_text(encoding="utf-8")
          if "id_ed25519.pub" in gabarit:
              fautes.append("web/index.html.template : la page ne doit pas conseiller le .pub")
          if "docker exec hbbs" in gabarit:
              fautes.append("web/index.html.template : docker exec hbbs, image sans shell")
          for f in fautes:
              print("::error::" + f)
          sys.exit(1 if fautes else 0)
          GARDE

      # Le controle qui manquait : un bloc <script> qui ne se parse pas est
      # abandonne EN ENTIER par le navigateur, et tout l'etat de l'application
      # tient dans un seul bloc. Une page entierement inerte etait donc
      # publiable sans qu'aucune etape ne s'en apercoive.
      - name: Check inline JavaScript syntax
        run: ./scripts/check-syntax.sh

      - name: Test Asset Extraction & Patching
        run: |
          ./scripts/extract-assets.sh
          ./scripts/patch-assets.sh

      - name: Generate CI Configuration
        run: |
          printf 'admin:$6$rounds=5000$test$salt\n' > .htpasswd
          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_BACKEND_HOST__|127.0.0.1|g" \
              -e "s|__RD_PUBLIC_KEY__|ci_test_key|g" \
              -e "s|__RD_DEFAULT_PEER_ID__||g" \
              -e "s|__RD_ACME_EMAIL__|ci@example.com|g" \
              -e "s|__RD_SESSION_TOKEN__|ci_token|g" \
              nginx.conf.template > nginx.conf

          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_ACME_EMAIL__|ci@example.com|g" \
              Caddyfile.template > Caddyfile

          sed -e "s|__RD_DOMAIN__|localhost|g" \
              -e "s|__RD_PUBLIC_KEY__|ci_test_key|g" \
              -e "s|__RD_DEFAULT_PEER_ID__||g" \
              web/index.html.template > html/index.html

      # La substitution elle-meme peut casser la page : une valeur contenant
      # un guillemet ou une barre oblique inverse suffit. On revalide donc la
      # page rendue, pas seulement le gabarit.
      - name: Check rendered page syntax
        run: ./scripts/check-syntax.sh html/index.html

      # Ce que patch-assets.sh corrige est vital : sans ses cinq correctifs,
      # aucune connexion n'aboutit. Une evolution du bundle les ferait echouer
      # en silence.
      - name: Verify bundle patches were applied
        run: |
          for m in '/ws/relay' 'get_conn_status' '__rdUnzstd'; do
            grep -q -- "$m" html/js/dist/index.js \
              || { echo "correctif absent du bundle : $m"; exit 1; }
          done

      # Le controle qui manquait le plus. Un artefact aux tags protobuf
      # permutes a deja tenu deux heures en production : hbbs acceptait, hbbr
      # repondait « invalid key ». On verifie donc le fichier tel qu'il part
      # dans l'image, pas seulement celui du depot -- c'est la ou etait
      # l'angle mort.
      - name: Verify authentication wire format in the image
        run: |
          docker build -t rustdesk-web:ci-check .
          check() {
            n=$(docker run --rm rustdesk-web:ci-check \
                  grep -c -F "$1" /usr/share/nginx/html/js/dist/index.js || true)
            [ "$n" = "$2" ] || { echo "attendu $2 occurrence(s) de « $1 », vu $n"; exit 1; }
          }
          check 'uint32(18).string(u.uuid)'        1   # RequestRelay.uuid        = champ 2
          check 'uint32(50).string(u.licence_key)' 1   # RequestRelay.licence_key = champ 6
          check 'uint32(18).string(u.licence_key)' 0   # la permutation fautive

      - name: Build Docker Image
        run: |
          docker build -t rustdesk-web:ci .
          docker build -t rustdesk-tls:ci -f Dockerfile.tls .

      # Un conteneur qui demarre ne prouve rien ; on veut la configuration
      # nginx validee et le refus d'acces effectif.
      - name: Smoke test the web image
        run: |
          docker run --rm rustdesk-web:ci nginx -t
          docker run -d --name rdweb-ci -p 18081:80 rustdesk-web:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/healthz || true)
            [ "$code" = "204" ] && break
            sleep 1
          done
          test "$code" = "204" || { docker logs rdweb-ci; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/)
          test "$code" = "401" || { echo "page accessible sans identifiants : $code"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/js/dist/index.js.orig)
          test "$code" = "404" || { echo "sources non corrigees servies : $code"; exit 1; }

          docker rm -f rdweb-ci
